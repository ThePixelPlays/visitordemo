<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مكتب استقبال الزوار</title>
<link rel="icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="/styles.css?v=1790683215">
</head>
<body>
<div class="wrap" id="wrap" dir="rtl" lang="ar">
  <header class="head">
    <div class="head-in">
      <img class="logo" id="logo" alt="" src="/logo.png">
      <div class="tools">
        <div class="seg" id="seg" role="group" hidden>
          <button id="asManager" aria-pressed="true"></button>
          <button id="asSecretary" aria-pressed="false"></button>
        </div>
        <button class="btn-bell" id="bellBtn" type="button" aria-pressed="true" hidden></button>
        <button class="btn-lang" id="langBtn">English</button>
        <button class="btn-m" id="reportBtn" aria-pressed="false"></button>
        <div class="clock" id="clock">--:--:--</div>
        <button class="btn-out" id="outBtn"></button>
      </div>
    </div>
  </header>
  <main id="main" style="display:flex;flex-direction:column;gap:14px">
    <div class="none" id="boot"></div>
  </main>
</div>
<footer id="foot" dir="rtl" lang="ar"><span id="footL"></span><span id="footR"></span></footer>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="/i18n.js?v=1790683215"></script>
<script src="/app.js?v=1790683215"></script>
</body>
</html>
